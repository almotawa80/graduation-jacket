<!doctype html>
<html lang="ar" dir="rtl">
<head>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المدير</title>
<link rel="stylesheet" href="assets/fonts.css?v=20261005h">
<link rel="stylesheet" href="assets/style.css?v=20261005h">
</head>
<body>
<div id="demo" class="demo" hidden>وضع تجريبي: كلمة المرور <b>admin</b>، والبيانات في متصفحك فقط.</div>
<header class="top"><h1>لوحة المدير</h1></header>
<main>
  <form id="login" class="card login">
    <label for="pw">كلمة المرور</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="check" style="margin-top:10px;padding:8px 12px"><input type="checkbox" id="rem" checked><span>تذكّر هذا الجهاز</span></label>
    <div id="lerr" class="msg err" hidden></div>
    <button class="block" data-ic="logout" style="margin-top:12px">دخول</button>
    <p style="text-align:center;margin:14px 0 0"><a class="lnk" data-ic="home" href="index.html">العودة إلى صفحة الطلب</a></p>
  </form>

  <div id="panel" hidden>
    <div class="adminbar">
      <div class="seg" role="group" aria-label="أقسام اللوحة">
        <button type="button" id="tOrders" data-ic="list" aria-pressed="true">الطلبات</button>
        <button type="button" id="tSettings" data-ic="gear" aria-pressed="false">الإعدادات</button>
      </div>
      <div class="barlinks">
        <button type="button" class="lnk" id="refresh" data-ic="refresh" title="تحديث البيانات">تحديث</button>
        <a class="lnk" data-ic="external" href="index.html">صفحة الطلب</a>
        <button type="button" class="lnk" id="logout" data-ic="logout">خروج</button>
      </div>
    </div>

    <div id="sync" class="msg info" hidden><span class="spin"></span>جارٍ تحديث الطلبات…</div>
    <div id="note" class="msg err" role="status" hidden></div>
    <section id="vOrders">
      <div class="seg seg2" role="group" aria-label="قوائم الطلبات">
        <button id="vActive" type="button" aria-pressed="true">النشطة <span class="cnt" id="nActive">0</span></button>
        <button id="vCanc" type="button" aria-pressed="false">الملغاة <span class="cnt" id="nCanc">0</span></button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="sizes" id="sizeSum"></div>
      <div class="tools">
        <input id="q" type="text" placeholder="بحث بالاسم أو الهاتف أو الصف">
        <select id="fs"><option value="">كل الحالات</option><option value="new">جديد</option><option value="approved">معتمد</option><option value="edit">بانتظار تعديل</option></select>
        <button type="button" class="lnk boxed" id="csv" data-ic="download">تصدير Excel</button>
      </div>
      <div id="list" class="orders"></div>
    </section>

    <section id="vSettings" hidden>
      <form id="sform" class="card">
        <fieldset><label class="check"><input type="checkbox" id="s_open"><span>باب الطلبات مفتوح</span></label></fieldset>
        <div class="row two">
          <fieldset><label for="s_max">أقصى عدد حروف للاسم</label><input id="s_max" type="number" min="1" max="30"></fieldset>
          <fieldset><label for="s_num">رقم الظهر (ثابت)</label><input id="s_num" type="text" inputmode="numeric" maxlength="3"></fieldset>
        </div>
        <fieldset><legend>المقاسات المتاحة</legend><div class="chips" id="s_sizes"></div></fieldset>
        <fieldset><label for="s_title">عنوان الصفحة</label><input id="s_title" type="text"></fieldset>
        <fieldset><label for="s_intro">نص التعريف</label><textarea id="s_intro" rows="2"></textarea></fieldset>
        <fieldset><label for="s_closed">رسالة إغلاق الطلبات</label><input id="s_closed" type="text"></fieldset>
        <fieldset><label for="s_cc">مفتاح الدولة لواتساب</label><input id="s_cc" type="text" inputmode="numeric" dir="ltr" style="text-align:right"><div class="hint">الكويت 965 — يُضاف للأرقام المكوّنة من 8 أرقام.</div></fieldset>
        <fieldset><label for="s_ap">رسالة الاعتماد</label><textarea id="s_ap" rows="4"></textarea><div class="hint">المتغيرات: {student} اسم الطالب، {name} الاسم على الجاكيت، {size} المقاس</div></fieldset>
        <fieldset><label for="s_ed">رسالة طلب تعديل الاسم</label><textarea id="s_ed" rows="4"></textarea></fieldset>
        <div id="sres" class="msg ok" hidden></div>
        <button class="block" data-ic="check">حفظ الإعدادات</button>
      </form>
    </section>
  </div>
</main>
<script src="assets/icons.js?v=20261005h"></script>
<script src="assets/config.js?v=20261005h"></script>
<script src="assets/api.js?v=20261005h"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (API.demo) $("demo").hidden = false; else API.call("settings");   /* إيقاظ الخادم مبكراً */
  var KEY = "", ORDERS = [], SET = {};
  var LBL = { "new": "جديد", approved: "معتمد", edit: "بانتظار تعديل", cancelled: "ملغي" };
  var noteT;
  function note(m, ok) { var n = $("note"); n.textContent = m; n.className = "msg " + (ok ? "ok" : "err"); n.hidden = false; clearTimeout(noteT); noteT = setTimeout(function () { n.hidden = true; }, 5000); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* نسخة محلية من الطلبات للعرض الفوري (على جهاز المدير فقط، عند تفعيل «تذكّر هذا الجهاز») */
  function saveCache() { try { if (localStorage.getItem("jk_key")) localStorage.setItem("jk_orders", JSON.stringify({ o: ORDERS, s: SET })); } catch (x) {} }
  async function load() {
    var r = await API.call("orders", { key: KEY });
    if (!r.ok) return r;
    ORDERS = r.orders; SET = Object.assign({}, API.DEFAULTS, r.settings); saveCache(); return r;
  }
  $("login").addEventListener("submit", async function (e) {
    e.preventDefault(); KEY = $("pw").value;
    var btn = $("login").querySelector("button"); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>جارٍ الدخول…'; $("lerr").hidden = true;
    /* إظهار اللوحة فوراً أثناء انتظار الخادم، والرجوع لشاشة الدخول إن كانت الكلمة خاطئة */
    $("login").hidden = true; $("panel").hidden = false; $("list").innerHTML = '<div class="msg info">جارٍ تحميل الطلبات…</div>';
    var r = await load();
    btn.disabled = false; btn.innerHTML = IC("logout") + "دخول";
    if (!r.ok) { $("panel").hidden = true; $("login").hidden = false; $("lerr").textContent = r.error || "تعذّر الدخول"; $("lerr").hidden = false; return; }
    try { sessionStorage.setItem("jk_key", KEY); if ($("rem").checked) localStorage.setItem("jk_key", KEY); else localStorage.removeItem("jk_key"); } catch (x) {}
    show();
  });
  function show() { $("login").hidden = true; $("panel").hidden = false; renderOrders(); fillSettings(); }
  $("logout").onclick = function () { try { sessionStorage.removeItem("jk_key"); localStorage.removeItem("jk_key"); } catch (x) {} location.reload(); };
  $("refresh").onclick = async function () { var rb = this; rb.classList.add("busy"); var r = await load(); rb.classList.remove("busy"); if (r.ok) { renderOrders(); fillSettings(); } else note(r.error || "تعذّر التحديث", false); };
  function tab(o) { $("vOrders").hidden = !o; $("vSettings").hidden = o; $("tOrders").setAttribute("aria-pressed", String(o)); $("tSettings").setAttribute("aria-pressed", String(!o)); }
  $("tOrders").onclick = function () { tab(true); }; $("tSettings").onclick = function () { tab(false); };

  function waLink(o, kind) {
    var ph = API.digits(o.phone); if (ph.length === 8) ph = (SET.countryCode || "965") + ph;
    var t = (kind === "approved" ? SET.approveMsg : SET.editMsg).replace(/\{student\}/g, o.student).replace(/\{name\}/g, o.jacketName).replace(/\{size\}/g, o.size);
    return "https://wa.me/" + ph + "?text=" + encodeURIComponent(t);
  }
  async function setStatus(id, st) {
    /* تحديث فوري للواجهة ثم تأكيد من الخادم؛ وعند الفشل نعيد الحالة السابقة */
    var o0 = ORDERS.filter(function (o) { return o.id === id; })[0]; if (!o0) return;
    var prev = o0.status; o0.status = st; renderOrders(); saveCache();
    var r = await API.call("setStatus", { key: KEY, id: id, status: st });
    if (!r.ok) { o0.status = prev; renderOrders(); saveCache(); note(r.error || "تعذّر تنفيذ العملية، أُعيدت الحالة السابقة.", false); }
  }

  IC.apply();
  var VIEW = "active";
  function setView(v) {
    VIEW = v;
    $("vActive").setAttribute("aria-pressed", String(v === "active")); $("vCanc").setAttribute("aria-pressed", String(v === "cancelled"));
    $("fs").hidden = v === "cancelled"; $("fs").value = "";
    renderOrders();
  }
  $("vActive").onclick = function () { setView("active"); }; $("vCanc").onclick = function () { setView("cancelled"); };

  function renderOrders() {
    var c = { "new": 0, approved: 0, edit: 0 }, sz = {}, nAct = 0, nCan = 0;
    ORDERS.forEach(function (o) { if (o.status === "cancelled") { nCan++; return; } nAct++; if (c[o.status] != null) c[o.status]++; sz[o.size] = (sz[o.size] || 0) + 1; });
    $("nActive").textContent = nAct; $("nCanc").textContent = nCan;
    $("stats").hidden = $("sizeSum").hidden = VIEW === "cancelled";
    $("stats").innerHTML = [["الكل", nAct], ["جديد", c["new"]], ["معتمد", c.approved], ["بانتظار تعديل", c.edit]].map(function (x) { return '<div class="stat"><b>' + x[1] + "</b>" + x[0] + "</div>"; }).join("");
    $("sizeSum").innerHTML = API.ALL_SIZES.map(function (z) { return "<span>" + z + ": " + (sz[z] || 0) + "</span>"; }).join("");
    var q = $("q").value.trim(), fs = $("fs").value;
    var rows = ORDERS.filter(function (o) {
      if ((VIEW === "cancelled") !== (o.status === "cancelled")) return false;
      if (fs && o.status !== fs) return false;
      if (!q) return true;
      return [o.student, o.jacketName, o.grade, o.phone].join(" ").indexOf(q) > -1;
    }).sort(function (a, b) { return b.id - a.id; });
    $("list").innerHTML = rows.length ? "" : '<div class="msg info">' + (VIEW === "cancelled" ? "لا توجد طلبات ملغاة." : "لا توجد طلبات.") + '</div>';
    rows.forEach(function (o) {
      var d = document.createElement("div"); d.className = "order";
      d.innerHTML = '<div class="nm">' + esc(o.jacketName) + '</div>' +
        '<div><b>' + esc(o.student) + '</b> <span class="badge b-' + o.status + '">' + LBL[o.status] + '</span></div>' +
        '<div class="meta">الصف: ' + esc(o.grade) + ' · المقاس: <b>' + esc(o.size) + '</b> · #' + o.id + '</div>' +
        '<div class="meta" dir="ltr" style="text-align:right">' + esc(o.phone) + '</div>' +
        '<div class="acts">' + (o.status === "cancelled"
          ? '<button class="sm ghost" data-r="1">' + IC("undo") + 'استعادة الطلب</button><button class="lnk dng" data-d="1">' + IC("trash") + 'حذف نهائي</button>'
          : '<a class="btn sm wa" target="_blank" rel="noopener" data-a="approved">' + IC("chat") + 'اعتماد</a>' +
            '<a class="btn sm warnb" target="_blank" rel="noopener" data-a="edit">' + IC("pencil") + 'طلب تعديل</a>' +
            '<button class="lnk dng" data-c="1">' + IC("x") + 'إلغاء الطلب</button>') + '</div>';
      d.querySelectorAll("a[data-a]").forEach(function (a) {
        a.href = waLink(o, a.dataset.a);
        a.addEventListener("click", function () { setStatus(o.id, a.dataset.a); });
      });
      var acts = d.querySelector(".acts"), orig = acts.innerHTML;
      var cb = d.querySelector("[data-c]"), rb = d.querySelector("[data-r]");
      if (rb) rb.onclick = function () { setStatus(o.id, "new"); };
      var db = d.querySelector("[data-d]");
      if (db) db.onclick = function () {
        acts.innerHTML = '<div class="msg err" style="margin:0;flex:1 1 100%"><b>حذف نهائي</b> لطلب «' + esc(o.jacketName) + '» للطالب ' + esc(o.student) + '؟ لا يمكن التراجع عن هذا الإجراء.</div>' +
          '<button class="sm danger" data-y="1">' + IC("check") + 'تأكيد الحذف النهائي</button><button class="sm ghost" data-n="1">تراجع</button>';
        acts.querySelector("[data-n]").onclick = function () { renderOrders(); };
        acts.querySelector("[data-y]").onclick = async function () {
          this.disabled = true; this.innerHTML = '<span class="spin"></span>جارٍ الحذف…';
          var r = await API.call("deleteOrder", { key: KEY, id: o.id });
          if (r.ok) { ORDERS = ORDERS.filter(function (x) { return x.id !== o.id; }); renderOrders(); note("تم حذف الطلب نهائياً.", true); }
          else { renderOrders(); note(r.error === "طلب غير معروف" ? "الخادم لا يدعم الحذف بعد: حدّث كود Apps Script وأعد النشر (إصدار جديد)." : (r.error || "تعذّر الحذف"), false); }
        };
      };
      if (cb) cb.onclick = function () {
        acts.innerHTML = '<div class="msg err" style="margin:0;flex:1 1 100%">هل تريد إلغاء طلب «' + esc(o.jacketName) + '» للطالب ' + esc(o.student) + '؟</div>' +
          '<button class="sm danger" data-y="1">' + IC("check") + 'تأكيد الإلغاء</button><button class="sm ghost" data-n="1">تراجع</button>';
        acts.querySelector("[data-y]").onclick = function () { this.disabled = true; this.innerHTML = '<span class="spin"></span>جارٍ الإلغاء…'; setStatus(o.id, "cancelled"); };
        acts.querySelector("[data-n]").onclick = function () { renderOrders(); };
      };
      $("list").appendChild(d);
    });
  }
  $("q").oninput = renderOrders; $("fs").onchange = renderOrders;

  $("csv").onclick = function () {
    var h = ["رقم", "التاريخ", "الاسم على الجاكيت", "الرقم", "المقاس", "الطالب", "الصف", "الهاتف", "الحالة"];
    var L = [h].concat(ORDERS.map(function (o) { return [o.id, o.createdAt, o.jacketName, o.number, o.size, o.student, o.grade, o.phone, LBL[o.status]]; }));
    var t = L.map(function (r) { return r.map(function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + t], { type: "text/csv;charset=utf-8" })); a.download = "orders.csv"; a.click();
  };

  function fillSettings() {
    $("s_open").checked = !!SET.open; $("s_max").value = SET.maxChars; $("s_num").value = SET.number;
    $("s_title").value = SET.title; $("s_intro").value = SET.intro; $("s_closed").value = SET.closedMessage;
    $("s_cc").value = SET.countryCode; $("s_ap").value = SET.approveMsg; $("s_ed").value = SET.editMsg;
    $("s_sizes").innerHTML = API.ALL_SIZES.map(function (z) { return '<label class="chip"><input type="checkbox" value="' + z + '"' + (SET.sizes.indexOf(z) > -1 ? " checked" : "") + "><span>" + z + "</span></label>"; }).join("");
  }
  $("sform").addEventListener("submit", async function (e) {
    e.preventDefault();
    var s = { open: $("s_open").checked, maxChars: Math.max(1, Math.min(30, +$("s_max").value || 8)), number: $("s_num").value.trim(), title: $("s_title").value, intro: $("s_intro").value,
      closedMessage: $("s_closed").value, countryCode: API.digits($("s_cc").value) || "965", approveMsg: $("s_ap").value, editMsg: $("s_ed").value,
      sizes: Array.prototype.map.call($("s_sizes").querySelectorAll("input:checked"), function (i) { return i.value; }) };
    if (!s.sizes.length) { note("اختر مقاساً واحداً على الأقل.", false); return; }
    var r = await API.call("saveSettings", { key: KEY, settings: s }), m = $("sres");
    m.className = "msg " + (r.ok ? "ok" : "err"); m.textContent = r.ok ? "تم حفظ الإعدادات." : (r.error || "تعذّر الحفظ"); m.hidden = false;
    if (r.ok) SET = Object.assign({}, SET, s);
  });

  /* استعادة الجلسة بعد تحديث الصفحة: لا نعود لشاشة الدخول إلا إذا رفض الخادم كلمة المرور فعلاً */
  (async function restore() {
    var k = null; try { k = sessionStorage.getItem("jk_key") || localStorage.getItem("jk_key"); } catch (x) {}
    if (!k) return;
    KEY = k; $("login").hidden = true; $("panel").hidden = false;
    var cached = null; try { cached = JSON.parse(localStorage.getItem("jk_orders") || "null"); } catch (x) {}
    if (cached && cached.o) { ORDERS = cached.o; SET = Object.assign({}, API.DEFAULTS, cached.s); show(); $("sync").hidden = false; }
    else $("list").innerHTML = '<div class="msg info">جارٍ تحميل الطلبات…</div>';
    var r;
    for (var i = 0; i < 3; i++) { r = await load(); if (r.ok || !/تعذّر الاتصال/.test(r.error || "")) break; await new Promise(function (z) { setTimeout(z, 1200); }); }
    $("sync").hidden = true;
    if (r.ok) { show(); return; }
    if (/تعذّر الاتصال/.test(r.error || "")) { $("list").innerHTML = ""; note("تعذّر الاتصال بالخادم. اضغط «تحديث» لإعادة المحاولة.", false); return; }
    try { sessionStorage.removeItem("jk_key"); localStorage.removeItem("jk_key"); } catch (x) {}
    $("panel").hidden = true; $("login").hidden = false;
  })();
})();
</script>
</body>
</html>
