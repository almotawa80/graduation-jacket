<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلب جاكيت التخرج</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preload" href="assets/foda.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/bodoni-digits.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/tajawal-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css?v=20261005d">
<link rel="stylesheet" href="assets/style.css?v=20261005d">
</head>
<body>
<div id="demo" class="demo" hidden>وضع تجريبي: الطلبات تُحفظ في متصفحك فقط حتى يُضبط رابط الخادم.</div>
<header class="top"><div class="hd"><div class="brand"><img src="assets/logo.webp" alt="شعار مدرسة الرؤية ثنائية اللغة" width="108" height="88" fetchpriority="high"></div><div class="ht"><h1 id="title">جاكيت التخرج</h1><p id="intro"></p></div></div></header>
<main>
  <div id="closed" class="card msg info" hidden></div>
  <div id="app" class="layout">
    <section class="stage-card card" id="stageCard" aria-label="معاينة الجاكيت">
      <div class="namefield">
        <label for="jname" class="stephead" style="margin-bottom:8px"><span class="n">1</span><h2>الاسم أو الختم على الجاكيت</h2></label>
        <input id="jname" type="text" inputmode="text" lang="ar" dir="rtl" placeholder="اكتب هنا" autocomplete="off" enterkeyhint="done" required>
        <div class="counter"><span>حروف عربية فقط</span><span id="cnt"></span></div>
      </div>
      <div class="stage" id="jacket"></div>
    </section>
    <form id="form" class="card" novalidate autocomplete="off">
      <div class="sect">
        <div class="stephead"><span class="n">2</span><h2>المقاس</h2></div>
        <div class="chips" id="sizes"></div>
      </div>
      <div class="sect">
        <div class="stephead"><span class="n">3</span><h2>بيانات التحقق</h2></div>
        <div class="row">
          <div><label for="student">الاسم الكامل</label><input id="student" type="text" autocomplete="off" required></div>
          <div class="row two">
            <div><label for="grade">الصف</label><input id="grade" type="text" required></div>
            <div><label for="phone">رقم الهاتف</label><input id="phone" type="tel" inputmode="numeric" maxlength="14" autocomplete="tel-national" placeholder="8 أرقام" dir="ltr" style="text-align:right" required></div>
          </div>
        </div>
      </div>
      <div class="sect">
        <label class="check"><input id="ok" type="checkbox"><span>أؤكد أن الاسم المكتوب على الجاكيت صحيح، وأن بياناتي صحيحة.</span></label>
        <div id="err" class="msg err" role="alert" hidden></div>
        <button id="send" class="block" type="submit" data-ic="send" style="margin-top:12px">إرسال الطلب</button>
      </div>
    </form>
  </div>
  <div id="done" class="card done" hidden></div>
</main>
<div class="sendbar" id="sendbar" aria-live="polite">
  <div class="sb-sum"><b id="sbName">—</b><span id="sbSize">اختر المقاس</span></div>
  <button type="button" id="sbSend" class="sb-btn" data-ic="send">إرسال الطلب</button>
</div>
<footer class="foot"><a href="admin.html" rel="nofollow" data-ic="gear">إدارة الصفحة</a></footer>
<script src="assets/config.js?v=20261005d"></script>
<script src="assets/icons.js?v=20261005d"></script>
<script src="assets/api.js?v=20261005d"></script>
<script src="assets/jacket.js?v=20261005d"></script>
<script>try{IC.apply()}catch(e){}</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (API.demo) $("demo").hidden = false;

  /* الصفحة تظهر فوراً بآخر إعدادات محفوظة (أو الافتراضية)، ثم تُحدَّث عند وصول رد الخادم */
  var S = Object.assign({}, API.DEFAULTS);
  try { Object.assign(S, JSON.parse(localStorage.getItem("jk_pub") || "{}")); } catch (e) {}

  var nameEl = $("jname"), card = $("stageCard"), form = $("form"), err = $("err");
  var svg = Jacket.mount($("jacket"));
  var max = 8;

  function clean(v) { return v.replace(/[^ء-غف-يـ ]/g, "").replace(/\s{2,}/g, " ").slice(0, max); }
  function upd() {
    var v = clean(nameEl.value);
    if (v !== nameEl.value) nameEl.value = v;
    $("cnt").textContent = v.length + " / " + max;
    Jacket.update(svg, v.trim() || "اسمك", S.number);
  }
  function renderSizes() {
    var cur = (form.querySelector("input[name=size]:checked") || {}).value;
    $("sizes").innerHTML = S.sizes.map(function (z) {
      return '<label class="chip"><input type="radio" name="size" value="' + z + '"' + (z === cur ? " checked" : "") + '><span>' + z + '</span></label>';
    }).join("");
  }
  function apply() {
    $("title").textContent = S.title; $("intro").textContent = S.intro; document.title = S.title;
    max = +S.maxChars || 8; nameEl.maxLength = max;
    renderSizes(); upd();
    var open = !!S.open;
    $("closed").textContent = S.closedMessage; $("closed").hidden = open;
    if (!$("done").hidden) return;
    $("app").hidden = !open;
  }
  apply();
  $("app").hidden = !S.open;

  /* إعادة ضبط الاسم بعد وصول الخط (لتناسب العرض) */
  if (document.fonts) { document.fonts.addEventListener("loadingdone", upd); document.fonts.ready.then(upd); }

  var settingsReady = API.call("settings").then(function (r) {
    if (!r.ok) return;
    S = Object.assign({}, S, r.settings);
    try { localStorage.setItem("jk_pub", JSON.stringify(r.settings)); } catch (e) {}
    apply();
  });

  /* شريط الإرسال السفلي (الجوال): ملخص + زر إرسال، ويختفي أثناء الكتابة */
  function sbUpd() {
    var sz = (form.querySelector("input[name=size]:checked") || {}).value;
    $("sbName").textContent = nameEl.value.trim() || "—"; $("sbSize").textContent = sz ? "المقاس " + sz : "اختر المقاس";
  }
  nameEl.addEventListener("input", sbUpd); form.addEventListener("change", sbUpd); sbUpd();
  $("sbSend").addEventListener("click", function () { if (form.requestSubmit) form.requestSubmit(); else $("send").click(); });
  document.addEventListener("focusin", function (e) { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== "checkbox") document.body.classList.add("kb"); });
  document.addEventListener("focusout", function () { setTimeout(function () { var a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.type === "checkbox") document.body.classList.remove("kb"); }, 60); });
  nameEl.addEventListener("input", upd);
  nameEl.addEventListener("focus", function () { card.classList.add("typing"); Jacket.show(svg, "back"); });
  nameEl.addEventListener("blur", function () { card.classList.remove("typing"); });
  nameEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); } });
  /* إبقاء المعاينة داخل المنطقة المرئية عند ظهور لوحة المفاتيح (آيفون) */
  if (window.visualViewport) {
    var vv = window.visualViewport;
    var pin = function () { card.style.transform = window.innerWidth < 860 && vv.offsetTop > 0 ? "translateY(" + vv.offsetTop + "px)" : ""; };
    vv.addEventListener("resize", pin); vv.addEventListener("scroll", pin);
  }

  function esc2(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fail(m) { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center", behavior: "smooth" }); }
  /* رقم الهاتف: أرقام فقط وثمانية بالضبط (يُزال مفتاح 965 عند اللصق) */
  $("phone").addEventListener("input", function () {
    var d = API.digits(this.value);
    if (d.length === 11 && d.indexOf("965") === 0) d = d.slice(3);
    d = d.slice(0, 8); if (this.value !== d) this.value = d;
  });
  var FIELDS = { jname: nameEl, student: $("student"), grade: $("grade"), phone: $("phone") };
  function mark(el, bad) { el.setAttribute("aria-invalid", bad ? "true" : "false"); el.classList.toggle("bad", !!bad); }
  Object.keys(FIELDS).forEach(function (k) { FIELDS[k].addEventListener("input", function () { mark(FIELDS[k], false); }); });
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); err.hidden = true;
    var jn = nameEl.value.trim(), size = (form.querySelector("input[name=size]:checked") || {}).value;
    var st = $("student").value.trim(), gr = $("grade").value.trim(), ph = API.digits($("phone").value);
    /* تحقق فوري ومحلي من كل الحقول دون انتظار الخادم */
    var miss = [], first = null;
    function need(el, label, bad) { mark(el, bad); if (bad) { miss.push(label); if (!first) first = el; } }
    need(nameEl, "الاسم على الجاكيت", !jn);
    var noSize = !size; if (noSize) { miss.push("المقاس"); if (!first) first = $("sizes").querySelector("input"); }
    $("sizes").classList.toggle("bad", noSize);
    need($("student"), "الاسم الكامل", st.length < 3);
    need($("grade"), "الصف", !gr);
    need($("phone"), ph.length ? "رقم هاتف صحيح (8 أرقام)" : "رقم الهاتف", ph.length !== 8);
    var noOk = !$("ok").checked; if (noOk) { miss.push("تأكيد صحة البيانات"); if (!first) first = $("ok"); }
    if (miss.length) { fail("الناقص: " + miss.join("، ")); if (first && first.focus) first.focus({ preventScroll: true }); return; }
    var b = $("send"); b.disabled = true; b.innerHTML = '<span class="spin"></span>جارٍ الإرسال…';
    await settingsReady;                      /* يضمن استخدام أحدث إعدادات المقاسات والحروف */
    if (!S.open) { b.disabled = false; b.innerHTML = IC("send") + "إرسال الطلب"; return fail(S.closedMessage); }
    if (jn.length > max || S.sizes.indexOf(size) < 0) { b.disabled = false; b.innerHTML = IC("send") + "إرسال الطلب"; return fail(jn.length > max ? "الاسم أطول من الحد المسموح (" + max + " حروف)." : "المقاس غير متاح."); }
    var res = await API.call("submit", { order: { jacketName: jn, size: size, student: st, grade: gr, phone: ph } });
    b.disabled = false; b.innerHTML = IC("send") + "إرسال الطلب";
    if (!res.ok) return fail(res.error || "تعذّر إرسال الطلب.");
    $("app").hidden = true; document.body.classList.add("is-done"); var d = $("done"); d.hidden = false;
    d.innerHTML = '<svg class="okmark" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg>' +
      '<h2 id="doneH" tabindex="-1">' + (res.updated ? "تم تحديث طلبك بنجاح" : "تم استلام طلبك بنجاح") + '</h2>' +
      '<p class="sub">شكراً لك، وصلنا طلبك وسيراجعه المشرف.</p>' +
      '<div class="stage" style="max-width:240px;margin:6px auto 0"></div>' +
      '<div class="sum"><div>رقم الطلب: <b>' + res.id + '</b></div><div>الاسم الكامل: <b>' + esc2(st) + '</b></div><div>المقاس: <b>' + size + '</b></div></div>' +
      '<div class="msg info nx"><b>الخطوة التالية:</b> سيتواصل معك المشرف عبر واتساب على الرقم <b dir="ltr">' + esc2(ph) + '</b> لاعتماد الطلب. احتفظ برقم الطلب.</div>';
    var s2 = Jacket.mount(d.querySelector(".stage")); Jacket.update(s2, jn, S.number);
    var top = function () { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; try { $("doneH").focus({ preventScroll: true }); } catch (e) {} };
    top(); requestAnimationFrame(top); setTimeout(top, 120);
  });
})();
</script>
</body>
</html>
