<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلب جاكيت التخرج</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="demo" class="demo" hidden>وضع تجريبي: الطلبات تُحفظ في متصفحك فقط حتى يُضبط رابط الخادم.</div>
<header class="top"><div class="brand"><img src="assets/logo.jpg" alt="شعار مدرسة الرؤية ثنائية اللغة" width="109" height="88"></div><h1 id="title" style="margin-top:12px">جاكيت التخرج</h1><p id="intro"></p></header>
<main>
  <div id="closed" class="card msg info" hidden></div>
  <div id="app" class="layout" hidden>
    <section class="stage-card card" id="stageCard" aria-label="معاينة الجاكيت">
      <div class="stage" id="jacket"></div>
      <div class="namefield">
        <label for="jname" class="stephead" style="margin-bottom:8px"><span class="n">1</span><h2>الاسم أو الختم على الجاكيت</h2></label>
        <input id="jname" type="text" inputmode="text" lang="ar" dir="rtl" placeholder="مثال: المطوع" autocomplete="off" enterkeyhint="done" required>
        <div class="counter"><span>حروف عربية فقط</span><span id="cnt"></span></div>
      </div>
    </section>
    <form id="form" class="card" novalidate autocomplete="off">
      <div class="sect">
        <div class="stephead"><span class="n">2</span><h2>المقاس</h2></div>
        <div class="chips" id="sizes"></div>
      </div>
      <div class="sect">
        <div class="stephead"><span class="n">3</span><h2>بيانات التحقق</h2></div>
        <div class="row">
          <div><label for="student">الاسم الكامل</label><input id="student" type="text" autocomplete="off" required></div>
          <div class="row two">
            <div><label for="grade">الصف</label><input id="grade" type="text" required></div>
            <div><label for="phone">رقم الهاتف</label><input id="phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" required></div>
          </div>
        </div>
      </div>
      <div class="sect">
        <label class="check"><input id="ok" type="checkbox"><span>أؤكد أن الاسم المكتوب على الجاكيت صحيح، وأن بياناتي صحيحة.</span></label>
        <div id="err" class="msg err" role="alert" hidden></div>
        <button id="send" class="block" type="submit" style="margin-top:12px">إرسال الطلب</button>
      </div>
    </form>
  </div>
  <div id="done" class="card done" hidden></div>
</main>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/jacket.js"></script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  if (API.demo) $("demo").hidden = false;
  var S = API.DEFAULTS;
  var r = await API.call("settings");
  if (r.ok) S = Object.assign({}, S, r.settings);
  $("title").textContent = S.title; $("intro").textContent = S.intro; document.title = S.title;
  if (!S.open) { var c = $("closed"); c.textContent = S.closedMessage; c.hidden = false; return; }
  $("app").hidden = false;
  await Promise.all([document.fonts.load('90px "Foda Display"'), document.fonts.load('800 90px "Jacket Num"')]).catch(function () {});
  var svg = Jacket.mount($("jacket"));
  var max = +S.maxChars || 8;
  var nameEl = $("jname");
  nameEl.maxLength = max;
  /* حروف عربية ومسافة فقط */
  function clean(v) { return v.replace(/[^ء-غف-يـ ]/g, "").replace(/\s{2,}/g, " ").slice(0, max); }
  function upd() {
    var v = clean(nameEl.value);
    if (v !== nameEl.value) nameEl.value = v;
    $("cnt").textContent = v.length + " / " + max;
    Jacket.update(svg, v.trim() || "اسمك", S.number);
  }
  nameEl.addEventListener("input", upd); upd();
  var card = $("stageCard");
  nameEl.addEventListener("focus", function () { card.classList.add("typing"); Jacket.show(svg, "back"); });
  nameEl.addEventListener("blur", function () { card.classList.remove("typing"); });
  nameEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); } });
  /* إبقاء المعاينة داخل المنطقة المرئية عند ظهور لوحة المفاتيح (آيفون) */
  if (window.visualViewport) {
    var vv = window.visualViewport;
    var pin = function () { card.style.transform = window.innerWidth < 860 && vv.offsetTop > 0 ? "translateY(" + vv.offsetTop + "px)" : ""; };
    vv.addEventListener("resize", pin); vv.addEventListener("scroll", pin);
  }
  $("sizes").innerHTML = S.sizes.map(function (z, i) {
    return '<label class="chip"><input type="radio" name="size" value="' + z + '"' + (i === 0 ? "" : "") + '><span>' + z + '</span></label>';
  }).join("");
  var form = $("form"), err = $("err");
  function fail(m) { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center", behavior: "smooth" }); }
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); err.hidden = true;
    var jn = nameEl.value.trim(), size = (form.querySelector("input[name=size]:checked") || {}).value;
    var st = $("student").value.trim(), gr = $("grade").value.trim(), ph = API.digits($("phone").value);
    if (!jn) return fail("اكتب الاسم الذي يظهر على الجاكيت.");
    if (!size) return fail("اختر المقاس.");
    if (st.length < 3) return fail("اكتب اسمك الكامل.");
    if (!gr) return fail("اكتب الصف.");
    if (ph.length < 8 || ph.length > 15) return fail("رقم الهاتف غير صحيح.");
    if (!$("ok").checked) return fail("أكّد صحة البيانات قبل الإرسال.");
    var b = $("send"); b.disabled = true; b.textContent = "جارٍ الإرسال...";
    var res = await API.call("submit", { order: { jacketName: jn, size: size, student: st, grade: gr, phone: ph } });
    b.disabled = false; b.textContent = "إرسال الطلب";
    if (!res.ok) return fail(res.error || "تعذّر إرسال الطلب.");
    $("app").hidden = true; var d = $("done"); d.hidden = false;
    d.innerHTML = '<div class="big">✓</div><h2>' + (res.updated ? "تم تحديث طلبك" : "تم استلام طلبك") + '</h2>' +
      '<div class="stage" style="max-width:260px;margin:0 auto"></div>' +
      '<div class="sum"><div>رقم الطلب: <b>' + res.id + '</b></div><div>المقاس: <b>' + size + '</b></div></div>' +
      '<p class="hint">سيتواصل معك المشرف عبر واتساب لاعتماد الطلب.</p>';
    var s2 = Jacket.mount(d.querySelector(".stage")); Jacket.update(s2, jn, S.number);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
